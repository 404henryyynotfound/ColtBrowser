<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColtBrowser — Private Web Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            colt: {
              50: '#fff5f0',
              100: '#ffe6d9',
              500: '#ff5722',
              600: '#e64a19',
              700: '#bf360c',
            }
          }
        }
      }
    };
  </script>
  <style>
    /* Custom subtle scrollbars for tab bar and drawers */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes progressSweep {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(-20%); }
      100% { transform: translateX(0%); }
    }
    .loading-bar-active {
      animation: progressSweep 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 h-screen w-screen overflow-hidden flex flex-col select-none transition-colors duration-200">

  <!-- Top Browser Chrome -->
  <header class="bg-slate-200/90 dark:bg-zinc-900 border-b border-slate-300 dark:border-zinc-800 flex flex-col z-20 shadow-sm">
    
    <!-- Window Controls & Tab Strip -->
    <div class="flex items-center px-2 pt-2 gap-1.5">
      <!-- Traffic Lights / App Brand -->
      <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 mr-1">
        <span class="w-3 h-3 rounded-full bg-rose-500/90 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-amber-400/90 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500/90 inline-block"></span>
        <span class="ml-2 text-xs font-bold tracking-wider uppercase text-slate-500 dark:text-zinc-400 flex items-center gap-1">
          <svg class="w-3.5 h-3.5 text-orange-500" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5L4.5 5.8 12 2.2l7.5 3.6L12 9.5zm0 3.5l-10-5v4l10 5 10-5v-4l-10 5zm0 5l-10-5v4l10 5 10-5v-4l-10 5z"/>
          </svg>
          Colt
        </span>
      </div>

      <!-- Scrollable Tab Container -->
      <div id="tab-list" class="flex-1 flex items-center gap-1 overflow-x-auto no-scrollbar">
        <!-- Tabs injected dynamically via JS -->
      </div>

      <!-- New Tab Button -->
      <button id="btn-new-tab" title="New Tab (Ctrl+T)" class="p-2 rounded-lg text-slate-600 dark:text-zinc-400 hover:bg-slate-300/70 dark:hover:bg-zinc-800 hover:text-slate-900 dark:hover:text-white transition flex-shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>

    <!-- Navigation & Omnibox Toolbar -->
    <div class="bg-white dark:bg-zinc-900/95 px-2.5 py-2 flex items-center gap-2 border-t border-slate-300/60 dark:border-zinc-800/80">
      <!-- Navigation Controls -->
      <div class="flex items-center gap-1">
        <button id="btn-back" title="Back" disabled class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 disabled:opacity-35 disabled:pointer-events-none transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
        </button>
        <button id="btn-forward" title="Forward" disabled class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 disabled:opacity-35 disabled:pointer-events-none transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
          </svg>
        </button>
        <button id="btn-refresh" title="Reload Page" class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
          <svg id="icon-refresh" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
        </button>
        <button id="btn-home" title="ColtBrowser Home" class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
        </button>
      </div>

      <!-- Omnibox (Address / Search Bar) -->
      <form id="omnibox-form" class="flex-1 flex items-center bg-slate-100 dark:bg-zinc-800/90 hover:bg-slate-200/70 dark:hover:bg-zinc-800 focus-within:bg-white dark:focus-within:bg-zinc-950 focus-within:ring-2 focus-within:ring-orange-500/70 border border-slate-200 dark:border-zinc-700/80 rounded-xl px-3 py-1.5 transition">
        <!-- Security / DuckDuckGo Badge -->
        <div id="omnibox-badge" class="flex items-center gap-1.5 pr-2 text-emerald-600 dark:text-emerald-400 flex-shrink-0" title="Protected by DuckDuckGo Privacy">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
        </div>

        <input
          id="omnibox-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search with DuckDuckGo or enter address..."
          class="w-full bg-transparent text-sm text-slate-800 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-500 focus:outline-none font-normal"
        />

        <!-- Bookmark Star Button -->
        <button type="button" id="btn-bookmark-toggle" title="Bookmark this page" class="p-1 rounded-md text-slate-400 hover:text-amber-400 transition ml-1 flex-shrink-0">
          <svg id="icon-bookmark-star" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
          </svg>
        </button>

        <!-- Go Button -->
        <button type="submit" title="Go" class="ml-1.5 px-2.5 py-1 rounded-lg bg-orange-500 hover:bg-orange-600 text-white text-xs font-semibold transition flex-shrink-0">
          Go
        </button>
      </form>

      <!-- Right Utility Controls (Shield, Drawer, Theme) -->
      <div class="flex items-center gap-1">
        <!-- Privacy Shield Indicator -->
        <button id="btn-shield" title="ColtShield Tracker Blocker Active" class="hidden md:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-orange-500/10 text-orange-600 dark:text-orange-400 hover:bg-orange-500/20 text-xs font-medium transition">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
          </svg>
          <span id="tracker-count">14</span>
        </button>

        <!-- Library / History & Bookmarks Drawer Toggle -->
        <button id="btn-drawer" title="Bookmarks & History" class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
          </svg>
        </button>

        <!-- Theme Toggle -->
        <button id="btn-theme" title="Toggle Light / Dark Mode" class="p-2 rounded-lg text-slate-600 dark:text-zinc-300 hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
          <!-- Sun icon (shown in dark mode) -->
          <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Bookmarks Bar -->
    <div id="bookmarks-bar" class="bg-slate-50 dark:bg-zinc-900 px-3 py-1.5 flex items-center gap-1.5 overflow-x-auto no-scrollbar border-t border-slate-200/80 dark:border-zinc-800/80 text-xs">
      <!-- Bookmarks populated dynamically -->
    </div>

    <!-- Subtle Progress Bar -->
    <div class="h-0.5 w-full bg-transparent overflow-hidden">
      <div id="loading-bar" class="h-full bg-gradient-to-r from-orange-500 via-amber-400 to-orange-600 w-0"></div>
    </div>
  </header>

  <!-- Main Browser Viewport Area -->
  <main class="flex-1 relative overflow-hidden flex">
    
    <!-- Active Tab Viewport Container -->
    <div id="viewport-container" class="flex-1 h-full w-full relative overflow-y-auto bg-white dark:bg-zinc-950">
      <!-- Content dynamically rendered here (Start Page, DuckDuckGo Search Results, or Embedded Web Viewport) -->
    </div>

    <!-- Slide-over Drawer for Bookmarks & History -->
    <aside id="library-drawer" class="w-80 sm:w-96 bg-white dark:bg-zinc-900 border-l border-slate-200 dark:border-zinc-800 h-full shadow-2xl transform translate-x-full transition-transform duration-200 ease-out fixed right-0 top-0 bottom-0 z-40 flex flex-col">
      <div class="p-4 border-b border-slate-200 dark:border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
          <h2 class="font-semibold text-sm">ColtBrowser Library</h2>
        </div>
        <button id="btn-close-drawer" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-zinc-800 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Drawer Tabs -->
      <div class="grid grid-cols-2 p-2 gap-1 bg-slate-100 dark:bg-zinc-950/60 border-b border-slate-200 dark:border-zinc-800 text-xs font-medium">
        <button id="drawer-tab-bookmarks" class="py-1.5 rounded-lg bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-sm transition">Bookmarks</button>
        <button id="drawer-tab-history" class="py-1.5 rounded-lg text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 transition">History</button>
      </div>

      <!-- Drawer Content List -->
      <div id="drawer-content" class="flex-1 overflow-y-auto p-3 space-y-1.5">
        <!-- Populated dynamically -->
      </div>

      <!-- Drawer Footer -->
      <div id="drawer-footer" class="p-3 border-t border-slate-200 dark:border-zinc-800 flex justify-between items-center text-xs text-slate-500">
        <span id="drawer-count-label">0 items</span>
        <button id="btn-clear-history" class="hidden text-rose-500 hover:underline font-medium">Clear History</button>
      </div>
    </aside>

    <!-- Backdrop when drawer is open -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-black/30 backdrop-blur-[1px] z-30 hidden"></div>

    <!-- Custom Toast / Status Notification -->
    <div id="toast-notification" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-zinc-900 dark:bg-zinc-800 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-xl border border-zinc-700/80 opacity-0 pointer-events-none transition-all duration-200 z-50 flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-orange-500"></span>
      <span id="toast-text">Notification</span>
    </div>
  </main>

  <script>
    /**
     * ColtBrowser Core Engine
     * Handles tab management, per-tab history stacks, DuckDuckGo Instant Answer API + live search,
     * smart iframe sandbox rendering, and localStorage persistence.
     */
    (function () {
      // --- Default Bookmarks ---
      const DEFAULT_BOOKMARKS = [
        { title: 'ColtBrowser Welcome', url: 'colt://welcome', icon: '🐎' },
        { title: 'DuckDuckGo', url: 'https://duckduckgo.com', icon: '🦆' },
        { title: 'Wikipedia', url: 'https://en.m.wikipedia.org', icon: '📚' },
        { title: 'Internet Archive', url: 'https://archive.org', icon: '🏛️' },
        { title: 'Hacker News', url: 'https://news.ycombinator.com', icon: '📰' },
        { title: 'OpenStreetMap', url: 'https://www.openstreetmap.org', icon: '🗺️' },
        { title: 'Example Domain', url: 'https://example.com', icon: '🌐' }
      ];

      // --- Quick Dial Shortcuts on Home Page ---
      const QUICK_DIALS = [
        { title: 'DuckDuckGo', url: 'https://duckduckgo.com', desc: 'Private Search', color: 'from-orange-500 to-amber-500', letter: 'D' },
        { title: 'Wikipedia', url: 'https://en.m.wikipedia.org', desc: 'Free Encyclopedia', color: 'from-slate-600 to-slate-800', letter: 'W' },
        { title: 'Archive.org', url: 'https://archive.org', desc: 'Digital Library', color: 'from-emerald-500 to-teal-700', letter: 'A' },
        { title: 'OpenStreetMap', url: 'https://www.openstreetmap.org', desc: 'World Maps', color: 'from-sky-500 to-blue-600', letter: 'M' },
        { title: 'W3Schools', url: 'https://www.w3schools.com', desc: 'Web Dev Docs', color: 'from-green-500 to-emerald-700', letter: '3' },
        { title: 'Welcome Guide', url: 'colt://welcome', desc: 'About ColtBrowser', color: 'from-rose-500 to-orange-600', letter: 'C' }
      ];

      // --- Application State ---
      let state = {
        tabs: [],
        activeTabId: null,
        bookmarks: [],
        history: [],
        drawerOpen: false,
        drawerMode: 'bookmarks', // 'bookmarks' | 'history'
        trackersBlocked: 14
      };

      // --- DOM References ---
      const elTabList = document.getElementById('tab-list');
      const elViewport = document.getElementById('viewport-container');
      const elOmniboxForm = document.getElementById('omnibox-form');
      const elOmniboxInput = document.getElementById('omnibox-input');
      const elBookmarksBar = document.getElementById('bookmarks-bar');
      const elBtnBack = document.getElementById('btn-back');
      const elBtnForward = document.getElementById('btn-forward');
      const elBtnRefresh = document.getElementById('btn-refresh');
      const elBtnHome = document.getElementById('btn-home');
      const elBtnNewTab = document.getElementById('btn-new-tab');
      const elBtnBookmarkToggle = document.getElementById('btn-bookmark-toggle');
      const elIconBookmarkStar = document.getElementById('icon-bookmark-star');
      const elLoadingBar = document.getElementById('loading-bar');
      const elDrawer = document.getElementById('library-drawer');
      const elDrawerBackdrop = document.getElementById('drawer-backdrop');
      const elDrawerContent = document.getElementById('drawer-content');
      const elDrawerCount = document.getElementById('drawer-count-label');
      const elBtnClearHistory = document.getElementById('btn-clear-history');
      const elTrackerCount = document.getElementById('tracker-count');

      // --- Initialization ---
      function init() {
        loadStorage();
        applySavedTheme();
        bindEvents();
        renderBookmarksBar();
        createTab('colt://newtab');
      }

      function loadStorage() {
        try {
          const savedBookmarks = localStorage.getItem('coltbrowser_bookmarks');
          state.bookmarks = savedBookmarks ? JSON.parse(savedBookmarks) : [...DEFAULT_BOOKMARKS];
          const savedHistory = localStorage.getItem('coltbrowser_history');
          state.history = savedHistory ? JSON.parse(savedHistory) : [];
        } catch (e) {
          state.bookmarks = [...DEFAULT_BOOKMARKS];
          state.history = [];
        }
      }

      function saveBookmarks() {
        try {
          localStorage.setItem('coltbrowser_bookmarks', JSON.stringify(state.bookmarks));
        } catch (e) {}
      }

      function saveHistory() {
        try {
          localStorage.setItem('coltbrowser_history', JSON.stringify(state.history.slice(0, 100)));
        } catch (e) {}
      }

      function applySavedTheme() {
        const savedTheme = localStorage.getItem('coltbrowser_theme');
        if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      }

      // --- Toast Notification Helper ---
      let toastTimer = null;
      function showToast(msg) {
        const toast = document.getElementById('toast-notification');
        const text = document.getElementById('toast-text');
        text.textContent = msg;
        toast.classList.remove('opacity-0', 'pointer-events-none');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('opacity-0', 'pointer-events-none');
        }, 2600);
      }

      // --- Loading Bar Animation ---
      function triggerProgress() {
        elLoadingBar.classList.remove('loading-bar-active');
        elLoadingBar.style.width = '0%';
        void elLoadingBar.offsetWidth; // trigger reflow
        elLoadingBar.style.width = '100%';
        elLoadingBar.classList.add('loading-bar-active');
        setTimeout(() => {
          elLoadingBar.style.width = '0%';
          elLoadingBar.classList.remove('loading-bar-active');
        }, 700);
      }

      // --- Tab Management ---
      function createTab(initialUrl = 'colt://newtab') {
        const id = 'tab_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const tab = {
          id,
          title: 'New Tab',
          favicon: '🐎',
          stack: [],
          stackIndex: -1,
          searchResults: null
        };
        state.tabs.push(tab);
        state.activeTabId = id;
        navigateTab(id, initialUrl, true);
      }

      function closeTab(id, e) {
        if (e) e.stopPropagation();
        const idx = state.tabs.findIndex(t => t.id === id);
        if (idx === -1) return;

        state.tabs.splice(idx, 1);
        if (state.tabs.length === 0) {
          createTab('colt://newtab');
          return;
        }
        if (state.activeTabId === id) {
          const nextIdx = Math.min(idx, state.tabs.length - 1);
          state.activeTabId = state.tabs[nextIdx].id;
        }
        renderAll();
      }

      function switchTab(id) {
        if (state.activeTabId === id) return;
        state.activeTabId = id;
        renderAll();
      }

      function getActiveTab() {
        return state.tabs.find(t => t.id === state.activeTabId);
      }

      // --- URL & Query Parsing ---
      function parseInputToTarget(rawInput) {
        const trimmed = rawInput.trim();
        if (!trimmed) return { type: 'internal', url: 'colt://newtab' };

        // Internal protocols
        if (trimmed.startsWith('colt://')) {
          return { type: 'internal', url: trimmed.toLowerCase() };
        }

        // Explicit search prefix
        if (trimmed.startsWith('ddg:') || trimmed.startsWith('?')) {
          const q = trimmed.replace(/^(ddg:|\?)/, '').trim();
          return { type: 'search', query: q, url: `colt://search?q=${encodeURIComponent(q)}` };
        }

        // Check if input looks like a URL (no spaces, contains a dot or localhost or protocol)
        const hasProtocol = /^https?:\/\//i.test(trimmed);
        const isDomainLike = !/\s/.test(trimmed) && (trimmed.includes('.') || trimmed.startsWith('localhost'));

        if (hasProtocol || isDomainLike) {
          const normalizedUrl = hasProtocol ? trimmed : 'https://' + trimmed;
          return { type: 'web', url: normalizedUrl };
        }

        // Otherwise treat as a DuckDuckGo search query
        return {
          type: 'search',
          query: trimmed,
          url: `colt://search?q=${encodeURIComponent(trimmed)}`
        };
      }

      // --- Navigation Engine ---
      function navigateActive(rawInput) {
        const tab = getActiveTab();
        if (!tab) return;
        navigateTab(tab.id, rawInput, true);
      }

      function navigateTab(tabId, rawInput, pushToStack = true) {
        const tab = state.tabs.find(t => t.id === tabId);
        if (!tab) return;

        const target = parseInputToTarget(rawInput);
        triggerProgress();

        // Increment blocked trackers counter realistically on web visits
        if (target.type === 'web' || target.type === 'search') {
          state.trackersBlocked += Math.floor(Math.random() * 3) + 1;
          elTrackerCount.textContent = state.trackersBlocked;
        }

        if (pushToStack) {
          // Truncate forward history if navigating from middle of stack
          tab.stack = tab.stack.slice(0, tab.stackIndex + 1);
          tab.stack.push(target.url);
          tab.stackIndex = tab.stack.length - 1;
        }

        updateTabMetadata(tab, target);

        // Log to persistent history (skip blank newtab)
        if (target.url !== 'colt://newtab') {
          state.history.unshift({
            title: tab.title,
            url: target.url,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          saveHistory();
        }

        if (tab.id === state.activeTabId) {
          renderAll();
        } else {
          renderTabs();
        }
      }

      function updateTabMetadata(tab, target) {
        if (target.url === 'colt://newtab') {
          tab.title = 'New Tab';
          tab.favicon = '🐎';
        } else if (target.url === 'colt://welcome') {
          tab.title = 'Welcome to ColtBrowser';
          tab.favicon = '✨';
        } else if (target.url.startsWith('colt://search')) {
          const params = new URLSearchParams(target.url.split('?')[1]);
          const q = params.get('q') || 'Search';
          tab.title = `${q} — DuckDuckGo`;
          tab.favicon = '🦆';
        } else {
          try {
            const u = new URL(target.url);
            tab.title = u.hostname.replace(/^www\./, '');
            tab.favicon = '🌐';
          } catch (e) {
            tab.title = target.url;
            tab.favicon = '🌐';
          }
        }
      }

      function goBack() {
        const tab = getActiveTab();
        if (!tab || tab.stackIndex <= 0) return;
        tab.stackIndex--;
        const url = tab.stack[tab.stackIndex];
        updateTabMetadata(tab, parseInputToTarget(url));
        triggerProgress();
        renderAll();
      }

      function goForward() {
        const tab = getActiveTab();
        if (!tab || tab.stackIndex >= tab.stack.length - 1) return;
        tab.stackIndex++;
        const url = tab.stack[tab.stackIndex];
        updateTabMetadata(tab, parseInputToTarget(url));
        triggerProgress();
        renderAll();
      }

      function reloadCurrent() {
        const tab = getActiveTab();
        if (!tab) return;
        const currentUrl = tab.stack[tab.stackIndex] || 'colt://newtab';
        triggerProgress();
        renderViewport(tab, currentUrl, true);
      }

      // --- Rendering Functions ---
      function renderAll() {
        const tab = getActiveTab();
        if (!tab) return;
        const currentUrl = tab.stack[tab.stackIndex] || 'colt://newtab';

        renderTabs();
        updateToolbarState(tab, currentUrl);
        renderViewport(tab, currentUrl, false);
        if (state.drawerOpen) renderDrawer();
      }

      function renderTabs() {
        elTabList.innerHTML = '';
        state.tabs.forEach(tab => {
          const isActive = tab.id === state.activeTabId;
          const tabEl = document.createElement('div');
          tabEl.className = `group flex items-center gap-2 px-3 py-1.5 rounded-t-xl text-xs font-medium cursor-pointer max-w-[200px] min-w-[120px] transition-all border-t border-x ${
            isActive
              ? 'bg-white dark:bg-zinc-900 text-slate-900 dark:text-white border-slate-300/80 dark:border-zinc-800 shadow-sm'
              : 'bg-slate-200/50 dark:bg-zinc-950/60 text-slate-600 dark:text-zinc-400 border-transparent hover:bg-slate-300/50 dark:hover:bg-zinc-800/60'
          }`;

          tabEl.innerHTML = `
            <span class="text-sm leading-none flex-shrink-0">${tab.favicon}</span>
            <span class="truncate flex-1">${escapeHtml(tab.title)}</span>
            <button class="tab-close p-0.5 rounded-md opacity-60 group-hover:opacity-100 hover:bg-slate-300 dark:hover:bg-zinc-700 transition" title="Close Tab">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          `;

          tabEl.addEventListener('click', () => switchTab(tab.id));
          tabEl.querySelector('.tab-close').addEventListener('click', (e) => closeTab(tab.id, e));
          elTabList.appendChild(tabEl);
        });
      }

      function updateToolbarState(tab, currentUrl) {
        elBtnBack.disabled = tab.stackIndex <= 0;

        if (currentUrl === 'colt://newtab') {
          elOmniboxInput.value = '';

              </button>
              <button data-remove-bm="${index}" title="Remove Bookmark" class="p-1 rounded-md text-slate-400 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
              </button>
            </div>
          `).join('');

          elDrawerContent.querySelectorAll('[data-remove-bm]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const idx = Number(btn.getAttribute('data-remove-bm'));
              state.bookmarks.splice(idx, 1);
              saveBookmarks();
              renderBookmarksBar();
              renderDrawer();
              renderAll();
              showToast('Bookmark removed');
            });
          });
        } else {
          tabHist.className = 'py-1.5 rounded-lg bg-white dark:bg-zinc-800 text-slate-900 dark:text-white shadow-sm transition';
          tabBm.className = 'py-1.5 rounded-lg text-slate-500 dark:text-zinc-400 hover:text-slate-800 dark:hover:text-zinc-200 transition';
          elBtnClearHistory.classList.remove('hidden');
          elDrawerCount.textContent = `${state.history.length} entries`;

          if (state.history.length === 0) {
            elDrawerContent.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Browsing history is empty.</p>`;
            return;
          }

          elDrawerContent.innerHTML = state.history.map(item => `
            <button data-url="${escapeHtml(item.url)}" class="drawer-nav-btn w-full flex items-center justify-between gap-2 p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-zinc-800/80 transition text-left">
              <div class="overflow-hidden">
                <div class="text-xs font-medium truncate">${escapeHtml(item.title)}</div>
                <div class="text-[11px] text-slate-400 font-mono truncate">${escapeHtml(item.url)}</div>
              </div>
              <span class="text-[10px] text-slate-400 flex-shrink-0">${escapeHtml(item.timestamp)}</span>
            </button>
          `).join('');
        }

        elDrawerContent.querySelectorAll('.drawer-nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            navigateActive(btn.getAttribute('data-url'));
            toggleDrawer(false);
          });
        });
      }

      // --- Toggle Bookmark for Active Page ---
      function toggleCurrentBookmark() {
        const tab = getActiveTab();
        if (!tab) return;
        const currentUrl = tab.stack[tab.stackIndex] || 'colt://newtab';
        if (currentUrl === 'colt://newtab') {
          showToast('Start page cannot be bookmarked');
          return;
        }

        const existingIdx = state.bookmarks.findIndex(b => b.url === currentUrl);
        if (existingIdx !== -1) {
          state.bookmarks.splice(existingIdx, 1);
          showToast('Removed from Bookmarks');
        } else {
          state.bookmarks.push({
            title: tab.title,
            url: currentUrl,
            icon: tab.favicon
          });
          showToast('Added to Bookmarks');
        }
        saveBookmarks();
        renderBookmarksBar();
        updateToolbarState(tab, currentUrl);
        if (state.drawerOpen) renderDrawer();
      }

      // --- Event Listeners ---
      function bindEvents() {
        elBtnNewTab.addEventListener('click', () => createTab('colt://newtab'));
        elBtnBack.addEventListener('click', goBack);
        elBtnForward.addEventListener('click', goForward);
        elBtnRefresh.addEventListener('click', reloadCurrent);
        elBtnHome.addEventListener('click', () => navigateActive('colt://newtab'));
        elBtnBookmarkToggle.addEventListener('click', toggleCurrentBookmark);

        elOmniboxForm.addEventListener('submit', (e) => {
          e.preventDefault();
          navigateActive(elOmniboxInput.value);
          elOmniboxInput.blur();
        });

        elOmniboxInput.addEventListener('focus', () => {
          elOmniboxInput.select();
        });

        document.getElementById('btn-theme').addEventListener('click', () => {
          const isDark = document.documentElement.classList.toggle('dark');
          localStorage.setItem('coltbrowser_theme', isDark ? 'dark' : 'light');
          showToast(isDark ? 'Dark Mode enabled' : 'Light Mode enabled');
        });

        document.getElementById('btn-shield').addEventListener('click', () => {
          showToast(`ColtShield active: ${state.trackersBlocked} trackers blocked`);
        });

        document.getElementById('btn-drawer').addEventListener('click', () => toggleDrawer());
        document.getElementById('btn-close-drawer').addEventListener('click', () => toggleDrawer(false));
        elDrawerBackdrop.addEventListener('click', () => toggleDrawer(false));

        document.getElementById('drawer-tab-bookmarks').addEventListener('click', () => {
          state.drawerMode = 'bookmarks';
          renderDrawer();
        });

        document.getElementById('drawer-tab-history').addEventListener('click', () => {
          state.drawerMode = 'history';
          renderDrawer();
        });

        elBtnClearHistory.addEventListener('click', () => {
          state.history = [];
          saveHistory();
          renderDrawer();
          showToast('Browsing history cleared');
        });
      }

      // --- Security Escaping Helper ---
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Boot ColtBrowser
      init();
    })();
  </script>
</body>
</html>
